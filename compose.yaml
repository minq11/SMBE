name: smbe-server
services:
  app:
    build:
      context: .
      target: runner
    init: true
    restart: unless-stopped
    env_file: ${SMBE_ENV_FILE:-.env}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # DB 마이그레이션 전용. 운영 이미지(runner)에는 tsx·package.json 이 없고
  # 서버 호스트에는 Node 를 설치하지 않으므로, devDeps 가 있는 development 단계로 실행한다.
  # profiles 때문에 `up -d` 로는 뜨지 않는다:
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: development
    env_file: ${SMBE_ENV_FILE:-.env}
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
