name: smbe-dev
services:
  app:
    build:
      context: .
      target: development
    init: true
    env_file:
      - path: .env.local
        required: false
    ports:
      - "127.0.0.1:${LOCAL_PORT:-3001}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./public
          target: /app/public
          initial_sync: true
        - action: sync
          path: ./scripts
          target: /app/scripts
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./next.config.ts
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
